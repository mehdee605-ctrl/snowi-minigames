<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #2d3748; }
        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); z-index: 100; overflow-y: auto; padding: 40px 20px; }
        .screen.active { display: flex !important; }
        .logo { font-size: 80px; font-weight: 900; background: linear-gradient(135deg, #fff, #e0e7ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; }
        .tagline { font-size: 24px; color: #fff; margin-bottom: 50px; font-weight: 600; }
        .button-group { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; }
        .btn { padding: 16px 40px; font-size: 18px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; font-family: 'Cairo', sans-serif; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3); }
        .btn-secondary { background: white; color: #667eea; }
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-top: 30px; max-width: 1400px; }
        .category-card { background: white; border-radius: 16px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); }
        .category-card:hover { transform: translateY(-8px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2); }
        .category-icon { font-size: 45px; margin-bottom: 10px; }
        .category-title { font-size: 14px; font-weight: 700; color: #2d3748; margin-bottom: 6px; }
        .category-count { font-size: 11px; background: #edf2f7; color: #667eea; padding: 3px 6px; border-radius: 6px; display: inline-block; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; max-height: 70vh; overflow-y: auto; padding: 20px; background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); }
        .item-card { background: white; border: 3px solid #e2e8f0; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .item-card:hover { transform: scale(1.08); border-color: #667eea; box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3); }
        .item-card.selected { border-color: #667eea; background: #edf2f7; transform: scale(1.1); }
        .item-icon { font-size: 35px; margin-bottom: 6px; }
        .item-name { font-size: 11px; font-weight: 700; color: #2d3748; word-break: break-word; }
        .game-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; max-width: 1400px; width: 100%; }
        .game-board { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); }
        .board-title { font-size: 18px; font-weight: 700; color: #2d3748; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 3px solid #667eea; }
        .candidates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 8px; }
        .candidate-card { background: white; border: 2px solid #e2e8f0; border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .candidate-card:hover { transform: scale(1.08); border-color: #667eea; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
        .candidate-card.eliminated { background: #ff6b6b; opacity: 0.7; border-color: #ff0000; }
        .candidate-card.eliminated .candidate-name { color: white; font-weight: 900; }
        .candidate-icon { font-size: 20px; margin-bottom: 3px; }
        .candidate-name { font-size: 8px; font-weight: 700; word-break: break-word; }
        .game-sidebar { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; gap: 15px; }
        .turn-badge { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 16px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 16px; }
        .stat-box { background: #f7fafc; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 12px; color: #718096; font-weight: 600; margin-bottom: 4px; }
        .stat-value { font-size: 24px; color: #667eea; font-weight: 900; }
        .question-input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 14px; text-align: right; }
        .question-input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .answer-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn-answer { padding: 10px; font-size: 12px; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; font-family: 'Cairo', sans-serif; }
        .btn-yes { background: #48bb78; color: white; }
        .btn-no { background: #f56565; color: white; }
        .btn-unsure { background: #ed8936; color: white; }
        .btn-answer:hover { transform: scale(1.05); }
        .question-list { font-size: 11px; max-height: 250px; overflow-y: auto; background: #f7fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .question-item { padding: 6px; border-bottom: 1px solid #e2e8f0; color: #4a5568; font-weight: 600; }
        .guess-btn { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; transition: all 0.3s ease; font-family: 'Cairo', sans-serif; }
        .guess-btn:hover { background: #764ba2; transform: scale(1.02); }
        .remaining-info { text-align: center; font-size: 14px; color: #667eea; font-weight: 700; padding: 10px; background: #edf2f7; border-radius: 8px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 15px; }
        .header-title { font-size: 28px; font-weight: 900; color: #2d3748; }
        .btn-header { padding: 8px 16px; background: white; color: #667eea; border: 2px solid #667eea; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; transition: all 0.3s ease; font-family: 'Cairo', sans-serif; }
        .btn-header:hover { background: #667eea; color: white; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 16px; padding: 30px; max-width: 500px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
        .modal-title { font-size: 22px; font-weight: 900; color: #2d3748; margin-bottom: 20px; text-align: center; }
        .modal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .modal-item { background: white; border: 2px solid #e2e8f0; border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .modal-item:hover { border-color: #667eea; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); transform: scale(1.08); }
        .result-box { background: white; border-radius: 20px; padding: 50px 40px; text-align: center; max-width: 500px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15); }
        .result-emoji { font-size: 80px; margin-bottom: 20px; }
        .result-title { font-size: 36px; font-weight: 900; color: #2d3748; margin-bottom: 15px; }
        .result-subtitle { font-size: 20px; color: #667eea; font-weight: 700; margin-bottom: 30px; }
        .settings-box { background: white; border-radius: 16px; padding: 30px; max-width: 500px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); }
        .setting-item { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .setting-label { font-size: 16px; font-weight: 700; color: #2d3748; }
        .toggle { width: 60px; height: 34px; background: #cbd5e0; border: none; border-radius: 17px; cursor: pointer; position: relative; transition: all 0.3s ease; }
        .toggle.active { background: #48bb78; }
        .toggle::after { content: ''; position: absolute; width: 30px; height: 30px; background: white; border-radius: 50%; top: 2px; right: 2px; transition: all 0.3s ease; }
        .toggle.active::after { right: 28px; }
        @media (max-width: 1024px) { .game-layout { grid-template-columns: 1fr; } .categories-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div id="homeScreen" class="screen active">
        <div style="text-align: center;">
            <div class="logo">خَمِّن</div>
            <div class="tagline">أونلاين مع أصدقائك</div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="goCategories()">🎮 لعب</button>
                <button class="btn btn-secondary" onclick="goSettings()">⚙️ الإعدادات</button>
            </div>
        </div>
    </div>

    <div id="categoryScreen" class="screen">
        <div style="width: 100%; max-width: 1400px;">
            <div class="header">
                <div class="header-title">اختر الفئة</div>
                <button class="btn-header" onclick="goHome()">🏠</button>
            </div>
            <div class="categories-grid" id="categoriesGrid"></div>
        </div>
    </div>

    <div id="selectionScreen" class="screen">
        <div style="width: 100%; max-width: 1200px;">
            <div class="header">
                <div class="header-title">اختر شخصيتك السرية</div>
                <button class="btn-header" onclick="goHome()">🏠</button>
            </div>
            <div class="items-grid" id="itemsGrid"></div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn btn-primary" id="confirmBtn" style="display: none;" onclick="startGame()">✓ ابدأ اللعبة</button>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <div style="width: 100%; max-width: 1400px;">
            <div class="header">
                <div class="header-title">جولة اللعب</div>
                <button class="btn-header" onclick="goHome()">🏠</button>
            </div>
            <div class="game-layout">
                <div class="game-board">
                    <div class="board-title">🎯 الخيارات (اضغط لتعليم بأحمر)</div>
                    <div class="remaining-info" id="remainingInfo">جاري...</div>
                    <div class="candidates-grid" id="candidatesGrid"></div>
                </div>
                <div class="game-sidebar">
                    <div class="turn-badge" id="turnBadge">دورك الآن</div>
                    <div class="stat-box">
                        <div class="stat-label">عدد الأسئلة</div>
                        <div class="stat-value" id="questionCount">0</div>
                    </div>
                    <div style="background: #f7fafc; padding: 12px; border-radius: 8px;">
                        <input type="text" id="questionInput" class="question-input" placeholder="اسأل سؤالك...">
                        <div class="answer-buttons" style="margin-top: 8px;">
                            <button class="btn-answer btn-yes" onclick="ansYes()">نعم ✓</button>
                            <button class="btn-answer btn-unsure" onclick="ansUnsure()">؟</button>
                            <button class="btn-answer btn-no" onclick="ansNo()">لا ✗</button>
                        </div>
                    </div>
                    <button class="guess-btn" onclick="guessModal()">🎯 خمّن!</button>
                    <div class="question-list">
                        <div id="questionsList" style="color: #4a5568; text-align: center;">لا توجد أسئلة</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="resultScreen" class="screen">
        <div class="result-box">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <div class="result-title" id="resultTitle">فوز!</div>
            <div class="result-subtitle" id="resultSubtitle">الشخصية</div>
            <div style="background: #f7fafc; border-radius: 12px; padding: 20px; margin-bottom: 25px;" id="resultStats"></div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="newRound()">🔄 جديدة</button>
                <button class="btn btn-secondary" onclick="goHome()">🏠 رئيسي</button>
            </div>
        </div>
    </div>

    <div id="settingsScreen" class="screen">
        <div style="width: 100%; max-width: 600px;">
            <div class="header">
                <div class="header-title">⚙️ الإعدادات</div>
                <button class="btn-header" onclick="goHome()">🏠</button>
            </div>
            <div class="settings-box">
                <div class="setting-item">
                    <div class="setting-label">🎵 الموسيقى</div>
                    <button class="toggle active" id="musicToggle" onclick="toggleMusic()"></button>
                </div>
                <div class="setting-item">
                    <div class="setting-label">🔊 الأصوات</div>
                    <button class="toggle active" id="soundToggle" onclick="toggleSound()"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="guessModal">
        <div class="modal-content">
            <div class="modal-title">اختر الإجابة:</div>
            <div class="modal-grid" id="guessGrid"></div>
        </div>
    </div>

                {name:'سوبرمان',icon:'🦸'},{name:'باتمان',icon:'🦇'},{name:'الرجل الحديدي',icon:'🤖'},{name:'الهيلك',icon:'💪'},{name:'الكابتن أمريكا',icon:'🛡️'},{name:'الرجل العنكبوت',icon:'🕷️'},{name:'وندر وومان',icon:'👸'},{name:'فلاش',icon:'⚡'},{name:'أكوامان',icon:'🌊'},{name:'الخضراء الرحيقية',icon:'🌿'},{name:'الساحر الأحمر',icon:'🔴'},{name:'بينك بانثر',icon:'🐈'},{name:'ثور',icon:'⚡'},{name:'لوكي',icon:'🐍'},{name:'جاموراه',icon:'🦅'},{name:'كابوس',icon:'👹'},{name:'فانتاستيك فور',icon:'4️⃣'},{name:'إيكس مان',icon:'🧬'},{name:'ديدبول',icon:'🔫'},{name:'وولفرين',icon:'🐺'}
            ],
            pokemon: [
                {name:'Pikachu',icon:'⚡'},{name:'Charizard',icon:'🔥'},{name:'Blastoise',icon:'💧'},{name:'Venusaur',icon:'🌿'},{name:'Dragonite',icon:'🐉'},{name:'Gyarados',icon:'🐉'},{name:'Articuno',icon:'❄️'},{name:'Zapdos',icon:'⚡'},{name:'Moltres',icon:'🔥'},{name:'Mewtwo',icon:'🧠'},{name:'Mew',icon:'🌸'},{name:'Raichu',icon:'⚡'},{name:'Machamp',icon:'💪'},{name:'Golem',icon:'🪨'},{name:'Arcanine',icon:'🐕'},{name:'Lapras',icon:'🐢'},{name:'Snorlax',icon:'😴'},{name:'Gengar',icon:'👻'},{name:'Alakazam',icon:'🧠'},{name:'Machoke',icon:'💪'}
            ],
            videogames: [
                {name:'Mario',icon:'🍄'},{name:'Donkey Kong',icon:'🐵'},{name:'Link',icon:'⚔️'},{name:'Zelda',icon:'👸'},{name:'Sonic',icon:'⚡'},{name:'Pac-Man',icon:'👹'},{name:'Samus Aran',icon:'🤖'},{name:'Mega Man',icon:'🤖'},{name:'Final Fantasy Cloud',icon:'⚔️'},{name:'Street Fighter Ryu',icon:'💪'},{name:'Mortal Kombat Scorpion',icon:'🔥'},{name:'Resident Evil Chris',icon:'🧟'},{name:'Tomb Raider Lara',icon:'🏹'},{name:'Crash Bandicoot',icon:'🐨'},{name:'Spyro',icon:'🐉'},{name:'Banjo',icon:'🪤'},{name:'Conker',icon:'🐿️'},{name:'Master Chief',icon:'🤖'},{name:'Gordon Freeman',icon:'🔬'},{name:'Doomguy',icon:'🔫'}
            ],
            sports: [
                {name:'Cristiano Ronaldo',icon:'⚽'},{name:'Lionel Messi',icon:'⚽'},{name:'Neymar',icon:'⚽'},{name:'Kylian Mbappé',icon:'⚽'},{name:'LeBron James',icon:'🏀'},{name:'Stephen Curry',icon:'🏀'},{name:'Michael Jordan',icon:'🏀'},{name:'Roger Federer',icon:'🎾'},{name:'Novak Djokovic',icon:'🎾'},{name:'Serena Williams',icon:'🎾'},{name:'Usain Bolt',icon:'🏃'},{name:'Simone Biles',icon:'🤸'},{name:'Lewis Hamilton',icon:'🏎️'},{name:'Max Verstappen',icon:'🏎️'},{name:'Lionel Andrés Messi',icon:'⚽'},{name:'Diego Maradona',icon:'⚽'},{name:'Pele',icon:'⚽'},{name:'Muhammad Ali',icon:'🥊'},{name:'Mike Tyson',icon:'🥊'},{name:'Floyd Mayweather',icon:'🥊'}
            ]
        };

        const state = {
            category: null,
            myChoice: null,
            candidates: [],
            eliminated: new Set(),
            questions: [],
            currentPlayer: 1,
            musicEnabled: localStorage.getItem('music') !== 'false',
            soundEnabled: localStorage.getItem('sound') !== 'false'
        };

        function playSound() {
            if (!state.soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.setValueAtTime(800, ctx.currentTime);
                g.gain.setValueAtTime(0.1, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0, ctx.currentTime + 0.1);
                o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        function playMusic() {
            if (!state.musicEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const freqs = [261.63, 329.63, 392.00, 523.25];
                const now = ctx.currentTime;
                freqs.forEach((f, i) => {
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.connect(g); g.connect(ctx.destination);
                    o.frequency.setValueAtTime(f, now);
                    g.gain.setValueAtTime(0.05, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 2);
                    o.start(now + i*0.5); o.stop(now + i*0.5 + 2);
                });
                setTimeout(playMusic, 3000);
            } catch (e) {}
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function goHome() { playSound(); showScreen('homeScreen'); }
        function goCategories() { playSound(); showScreen('categoryScreen'); renderCategories(); }
        function goSettings() { playSound(); showScreen('settingsScreen'); }

        function renderCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '';
            const names = {
                genshin: '✨ Genshin',
                valorant: '⚔️ Valorant',
                movies: '🎬 أفلام',
                tvshows: '📺 مسلسلات',
                anime: '🎨 أنيمي',
                animals: '🦁 حيوانات',
                food: '🍔 طعام',
                superheroes: '🦸 أبطال',
                pokemon: '⚡ بوكيمون',
                videogames: '🎮 ألعاب',
                sports: '⚽ رياضة'
            };
            Object.entries(DB).forEach(([key, items]) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                const title = names[key];
                card.innerHTML = `<div class="category-icon">${title.split(' ')[0]}</div><div class="category-title">${title.split(' ').slice(1).join(' ')}</div><div class="category-count">${items.length}+</div>`;
                card.onclick = () => { playSound(); state.category = key; state.candidates = [...items]; state.eliminated.clear(); showScreen('selectionScreen'); renderItems(); };
                grid.appendChild(card);
            });
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            state.candidates.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `<div class="item-icon">${item.icon}</div><div class="item-name">${item.name}</div>`;
                card.onclick = () => {
                    playSound();
                    document.querySelectorAll('.item-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    state.myChoice = idx;
                    document.getElementById('confirmBtn').style.display = 'block';
                };
                grid.appendChild(card);
            });
        }

        function startGame() { playSound(); showScreen('gameScreen'); renderGame(); }

        function renderGame() {
            const grid = document.getElementById('candidatesGrid');
            grid.innerHTML = '';
            state.candidates.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'candidate-card';
                if (state.eliminated.has(idx)) card.classList.add('eliminated');
                card.innerHTML = `<div class="candidate-icon">${item.icon}</div><div class="candidate-name">${item.name}</div>`;
                card.onclick = () => {
                    playSound();
                    if (state.eliminated.has(idx)) state.eliminated.delete(idx);
                    else state.eliminated.add(idx);
                    card.classList.toggle('eliminated');
                    updateRemaining();
                };
                grid.appendChild(card);
            });
            updateRemaining();
        }

        function updateRemaining() {
            const count = state.candidates.length - state.eliminated.size;
            document.getElementById('remainingInfo').textContent = `${count} خيار متبقي`;
        }

        function ansYes() { addQuestion('نعم ✓'); }
        function ansNo() { addQuestion('لا ✗'); }
        function ansUnsure() { addQuestion('غير متأكد ؟'); }

        function addQuestion(answer) {
            const q = document.getElementById('questionInput').value;
            if (!q) return;
            playSound();
            state.questions.push({ q, answer });
            document.getElementById('questionInput').value = '';
            updateQuestions();
            state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
            document.getElementById('turnBadge').textContent = state.currentPlayer === 1 ? '🎮 دورك الآن' : '👥 دور صديقك';
            document.getElementById('questionCount').textContent = state.questions.length;
        }

        function updateQuestions() {
            const list = document.getElementById('questionsList');
            if (state.questions.length === 0) {
                list.innerHTML = '<div>لا توجد أسئلة</div>';
                return;
            }
            list.innerHTML = state.questions.map((q, i) => `<div class="question-item">${i+1}. ${q.q}<br/>${q.answer}</div>`).join('');
        }

        function guessModal() {
            playSound();
            const grid = document.getElementById('guessGrid');
            grid.innerHTML = '';
            state.candidates.forEach((item, idx) => {
                if (!state.eliminated.has(idx)) {
                    const card = document.createElement('div');
                    card.className = 'modal-item';
                    card.innerHTML = `<div style="font-size: 24px;">${item.icon}</div><div style="font-size: 10px;">${item.name}</div>`;
                    card.onclick = () => {
                        playSound();
                        const isCorrect = idx === state.myChoice;
                        document.getElementById('guessModal').classList.remove('active');
                        showResult(isCorrect, item);
                    };
                    grid.appendChild(card);
                }
            });
            document.getElementById('guessModal').classList.add('active');
        }

        function showResult(isCorrect, item) {
            document.getElementById('resultEmoji').textContent = isCorrect ? '🎉' : '😭';
            document.getElementById('resultTitle').textContent = isCorrect ? 'فوز!' : 'خسارة!';
            document.getElementById('resultSubtitle').textContent = `${item.icon} ${item.name}`;
            document.getElementById('resultStats').innerHTML = `<div style="font-size: 16px; color: #4a5568; font-weight: 600;">أسئلة: <span style="color: #667eea; font-weight: 900;">${state.questions.length}</span></div>`;
            showScreen('resultScreen');
        }

        function newRound() { playSound(); state.myChoice = null; state.questions = []; state.eliminated.clear(); showScreen('selectionScreen'); renderItems(); }

        function toggleMusic() {
            state.musicEnabled = !state.musicEnabled;
            localStorage.setItem('music', state.musicEnabled);
            document.getElementById('musicToggle').classList.toggle('active');
            if (state.musicEnabled) playMusic();
            playSound();
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            localStorage.setItem('sound', state.soundEnabled);
            document.getElementById('soundToggle').classList.toggle('active');
            playSound();
        }

        window.onload = () => {
            if (state.musicEnabled) playMusic();
            document.getElementById('musicToggle').classList.toggle('active', state.musicEnabled);
            document.getElementById('soundToggle').classList.toggle('active', state.soundEnabled);
        };
    </script>
</body>
